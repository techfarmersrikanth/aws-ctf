AWSTemplateFormatVersion: "2010-09-09"
Description: Sample CloudFormation template demonstrating Parameters, Mappings, and Conditions for EC2

# -------- PARAMETERS --------
Parameters:
  CreateEC2:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Should an EC2 instance be created?

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair for SSH access

# -------- MAPPINGS --------
Mappings:
  RegionMap:
    us-east-1:
      AMI: ami-0c02fb55956c7d316   # Amazon Linux 2 - N. Virginia
    us-west-2:
      AMI: ami-08962a4068733a2b6   # Amazon Linux 2 - Oregon
    ap-south-1:
      AMI: ami-0522ab6e1ddcc7055   # Amazon Linux 2 - Mumbai

# -------- CONDITIONS --------
Conditions:
  ShouldCreateEC2: !Equals [!Ref CreateEC2, Yes]

# -------- RESOURCES --------
Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SampleEC2SG

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Condition: ShouldCreateEC2
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
      SecurityGroupIds:
        - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: SampleEC2

# -------- OUTPUTS --------
Outputs:
  EC2InstanceId:
    Condition: ShouldCreateEC2
    Description: ID of the EC2 instance (if created)
    Value: !Ref MyEC2Instance

  EC2PublicDNS:
    Condition: ShouldCreateEC2
    Description: Public DNS of EC2 instance
    Value: !GetAtt MyEC2Instance.PublicDnsName
